<div class="min-h-screen bg-gray-50 p-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-semibold text-gray-900">{{ selectedWorkspace()?.name || 'Boards' }}</h2>
      <p class="mt-1 text-sm text-gray-500">Choose a board to open its Kanban view.</p>
    </div>
    <div class="flex gap-3">
      @if (selectedWorkspace()) {
        <button mat-flat-button [routerLink]="['/workspaces', selectedWorkspace().id, 'boards', 'create']">Create Board</button>
      }
       
    </div>
  </div>
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (board of boards(); track board.id) {
      <div class="block min-h-32 rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" (click)="goToBoardDetails(board.id)">
        <h3 class="text-lg font-medium text-gray-900">{{ board.name }}</h3>
        <p class="mt-2 text-sm text-gray-500">{{ board.description || 'Open board' }}</p>
      </div>
    } @empty {
      <div class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-500">
        No boards available.
      </div>
    }
  </div>
</div>
