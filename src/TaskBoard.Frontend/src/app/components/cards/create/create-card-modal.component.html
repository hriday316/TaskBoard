<div class="p-5 w-full bg-white">
  <h2 mat-dialog-title class=" mb-3 text-xs font-semibold text-gray-800">
    Create new Card
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3 mx-4">

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Title</mat-label>
      <input
        matInput
        formControlName="title"
        placeholder="Enter card title"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        rows="3"
        formControlName="description"
        placeholder="Enter card description"
      ></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Assign Member</mat-label>

      <mat-select formControlName="assignMemberId">
        <mat-option [value]="null">None</mat-option>

        @for (member of members; track member.id) {
          <mat-option [value]="member.id">
            {{ member.userName }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="space-y-2">
      <label for="fileInput" class="block text-sm font-medium text-gray-700">
        Attachments
      </label>

      <input
        type="file"
        id="fileInput"
        multiple
        class="block w-full text-sm text-gray-700 border border-gray-300 rounded-md p-2"
        (change)="onFileSelected($event)"
      />
    </div>

    @if (selectedFiles.length > 0) {
      <div class="border border-gray-200 rounded-md p-3">
        <h3 class="text-sm font-medium text-gray-700 mb-2">
          Selected Files
        </h3>

        <div class="space-y-2">
          @for (file of selectedFiles; track $index) {
            <div class="flex items-center justify-between text-sm bg-gray-50 px-2 py-1 rounded">
              <span class="truncate">
                {{ file.name }}
              </span>

              <button
                type="button"
                class="text-red-500 hover:text-red-700"
                (click)="removeFile($index)"
              >
                <mat-icon fontIcon="delete" class="text-base"></mat-icon>
              </button>
            </div>
          }
        </div>
      </div>
    }

    <div class="flex justify-end gap-2 pt-2">
      <button
        type="button"
        mat-button

        (click)="close()"
      >
        Cancel
      </button>

      <button
        type="submit"
        mat-flat-button
        color="primary"
        [disabled]="form.invalid"
      >
        Create
      </button>
    </div>

  </form>
</div>
