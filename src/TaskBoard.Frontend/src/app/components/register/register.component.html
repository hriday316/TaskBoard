 <div class="min-h-screen flex items-center justify-center px-4">
    <mat-card class="w-full max-w-lg p-8 bg-white">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-semibold text-primary">Register</h1>
            </div>
            <mat-form-field appearance="outline" class="w-full mb-4">
                <mat-label>Full Name</mat-label>
                <input matInput formControlName="name" type="text"
                    placeholder="John Doe" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full mb-4">
                <mat-label>Email address</mat-label>
                <input matInput formControlName="email" type="email"
                    placeholder="name@example.com" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full mb-3">
                <mat-label>Password</mat-label>
                <input matInput formControlName="password" type="password"
                    placeholder="Password" />
            </mat-form-field>
            <button mat-flat-button type="submit" color="primary"
                class="w-full py-2">Sign in</button>
        </form>
        <p class="text-center text-sm text-medium mt-4">
            Already have an account?  <a href="/login" class="text-blue-800 underline">Sign in</a>
    </mat-card>
</div>
