name: taskboard

services:
  postgres:
    image: postgres:17-alpine
    container_name: taskboard-postgres
    environment:
      POSTGRES_DB: TaskboardDB
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: taskboard123!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    

volumes:
  postgres-data:
